name = "wazoo-api"
main = "src/index.ts"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.wazoo.dev", custom_domain = true }
]

[vars]
API_BASE_URL = "https://api.wazoo.dev"
TURSO_DATABASE_URL = "libsql://wazoo-platform-prod-ethanthatonekid.aws-us-west-2.turso.io"
WORLDS_API_URL = "https://worlds-api.wazoo.dev"
WAZOO_ENV = "prod"
TURSO_ORG = "ethanthatonekid"
TURSO_GROUP = "fartlabs-cpu"
STRIPE_PRICE_ID = ""

[env.qa]
name = "wazoo-api-qa"

[env.qa.vars]
API_BASE_URL = "https://api-qa.wazoo.dev"
TURSO_DATABASE_URL = "libsql://wazoo-platform-qa-ethanthatonekid.aws-us-west-2.turso.io"
WORLDS_API_URL = "https://worlds-api-qa.wazoo.dev"
WAZOO_ENV = "qa"
TURSO_ORG = "ethanthatonekid"
TURSO_GROUP = "fartlabs-cpu"
STRIPE_PRICE_ID = ""

[observability]
enabled = true
head_sampling_rate = 1
