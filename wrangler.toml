name = "wazoo-api"
main = "src/index.ts"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.wazoo.dev", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "wazoo-api"
database_id = "54648bbf-c775-4c89-96b0-d1eb00dd2e43"

[vars]
API_BASE_URL = "https://api.wazoo.dev"
WORLDS_API_URL = "https://data.wazoo.dev"
WAZOO_ENV = "prod"
STRIPE_PRICE_ID = ""

[env.qa]
name = "wazoo-api-qa"
routes = [
  { pattern = "api-qa.wazoo.dev", custom_domain = true }
]

[[env.qa.d1_databases]]
binding = "DB"
database_name = "wazoo-api-qa"
database_id = "54648bbf-c775-4c89-96b0-d1eb00dd2e43"

[env.qa.vars]
API_BASE_URL = "https://api-qa.wazoo.dev"
WORLDS_API_URL = "https://data-qa.wazoo.dev"
WAZOO_ENV = "qa"
STRIPE_PRICE_ID = ""

[observability]
enabled = true
head_sampling_rate = 1
