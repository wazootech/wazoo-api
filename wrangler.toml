name = "wazoo-api"
main = "src/index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.wazoo.dev", custom_domain = true }
]

[vars]
API_BASE_URL = "https://api.wazoo.dev"
TURSO_DATABASE_URL = "libsql://wazoo-platform-prod-ethanthatonekid.aws-us-west-2.turso.io"
TURSO_ORGANIZATION_SLUG = "ethanthatonekid"
TURSO_GROUP = "fartlabs-cpu"
WAZOO_ENV = "prod"
STRIPE_PRICE_ID = ""

[observability]
enabled = true
head_sampling_rate = 1
