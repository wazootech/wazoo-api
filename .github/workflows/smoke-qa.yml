name: smoke-qa

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: "Management API base URL"
        required: false
        default: "https://api-qa.wazoo.dev"
      worldsApiUrl:
        description: "Data API base URL"
        required: false
        default: "https://data-qa.wazoo.dev"
      consoleUrl:
        description: "Console base URL"
        required: false
        default: "https://console-qa.wazoo.dev"

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Platform smoke gate against QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch secrets from Infisical (qa)
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MACHINE_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "qa"
          secret-name: WAZOO_PLATFORM_ADMIN_TOKEN
      - name: Run platform smoke gate
        run: pnpm run smoke:qa
        env:
          API_BASE_URL: ${{ inputs.apiBaseUrl || 'https://api-qa.wazoo.dev' }}
          WORLDS_API_URL: ${{ inputs.worldsApiUrl || 'https://data-qa.wazoo.dev' }}
          CONSOLE_URL: ${{ inputs.consoleUrl || 'https://console-qa.wazoo.dev' }}
