name: canary-prod

on:
  schedule:
    # Off the :00 and :30 marks: GitHub delays scheduled runs most at the start
    # of the hour, and this canary has been running about every four hours.
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Production reachability and auth-boundary canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run credential-free production canary
        id: canary
        continue-on-error: true
        run: |
          set +e
          node scripts/platform-canary.mjs 2> canary.err
          rc=$?
          cat canary.err >&2
          exit $rc
        env:
          CANARY_ENV: prod
      - name: Open, update, or close the canary issue
        run: bash scripts/canary-alert.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANARY_RESULT: ${{ steps.canary.outcome }}
          # Repository variable such as "@EthanThatOneKid". Unset means no mention.
          ALERT_MENTION: ${{ vars.ALERT_MENTION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Fail the job when the canary failed
        if: steps.canary.outcome != 'success'
        run: exit 1
