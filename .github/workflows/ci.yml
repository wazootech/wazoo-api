name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  contract-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Credential-free contract lint (R1-R5)
        uses: wazootech/workspace-cli/skills/contract-lint@f6b4e491b78a6ebe4c31560088eefcfd9f5ba4ba

  openapi-breaking:
    # Fails the PR when openapi/openapi.json drops or narrows something an
    # existing client relies on. Runs only when the snapshot changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect OpenAPI changes
        id: changed
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- openapi/; then
            echo "openapi=false" >> "$GITHUB_OUTPUT"
          else
            echo "openapi=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for breaking changes
        if: steps.changed.outputs.openapi == 'true'
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: "origin/${{ github.base_ref }}:openapi/openapi.json"
          revision: "HEAD:openapi/openapi.json"
          fail-on: ERR
          # Keep both specs inside CI; skip the oasdiff.com review upload.
          review: false

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec vitest run --coverage

  publish-image:
    # PAUSED: this container image cannot obtain a Cloudflare D1 binding and has
    # been inert since the Turso->D1 migration. The official Docker story now lives
    # in wazootech/wazoo-docker. Re-enable only if a real container use case demands it.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
